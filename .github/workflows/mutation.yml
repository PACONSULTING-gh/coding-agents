name: Mutation testing

# Job separado del `ci.yml` de cada PR (docs/quality-gates.md T06): Stryker es
# lento y correrlo en cada PR seria exactamente el ruido que CLAUDE.md 2.4
# quiere evitar. Corre programado (semanal) o a mano desde la pestana Actions.
# Se anade a `ci-ok` (bloqueo por PR) cuando los modulos criticos se
# estabilicen; packages/graph sigue sin estarlo, medido en stryker.config.json.
#
# LO QUE SI ES BLOQUEANTE YA (Epic 05 / T03, Issue #23): la EJECUCION de este
# workflow, cuando corre. Antes el paso de abajo llevaba `continue-on-error:
# true` y el job salia siempre en verde, incluso con la puntuacion de
# mutacion por debajo de `thresholds.break` — exactamente el "gate que
# parecia puesto y estaba roto" que este epic existe para evitar. Ya no: sin
# `continue-on-error`, el propio exit code de Stryker (no logica nuestra)
# tumba el job cuando la puntuacion no llega al umbral.
#
# Probado localmente forzando la violacion (packages/core/src/tenant.ts,
# quitando el test que mata al mutante del cuerpo de `runWithTenant`, umbral
# `break` bajado a 90 solo para la prueba): puntuacion real 87.50, Stryker
# emite "Final mutation score 87.50 under breaking threshold 90, setting exit
# code to 1 (failure)." y el proceso termina con exit 1. El unico cambio de
# este PR es dejar de tragarnos ese exit code.
on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  mutation:
    name: Stryker (modulos criticos)
    runs-on: ubuntu-latest
    # El Postgres de los tests de integracion, provisionado FUERA del proceso
    # de test (ADR 0007). Sin esto el job no arranca: los tests se NIEGAN a
    # correr bajo Stryker sin `TEST_DATABASE_URL`, porque levantar un contenedor
    # por mutante hace que la puntuacion salga de los timeouts en vez de los
    # tests (issue #26: `client.ts` marcaba 90,34 con CERO mutantes muertos).
    #
    # `POSTGRES_HOST_AUTH_METHOD: trust` y no una contrasena: este servicio vive
    # y muere con el job, solo es alcanzable desde dentro del runner, y asi no
    # hace falta inventar un secreto de repositorio que, si alguien olvida
    # crear, rompe el workflow con un error que no se entiende. Lo que los tests
    # ejercitan —separacion de roles, propiedad de las tablas, RLS forzada—
    # sigue siendo identico: lo unico que cambia es como se autentica.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coord
          POSTGRES_DB: coord
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coord -d coord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coord@localhost:5432/coord
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tests importan los .d.ts de @coord/*, que viven en dist/ y no estan
      # en el repositorio.
      - run: pnpm -r build
      # PASO PREVIO Y BLOQUEANTE: valida la configuracion sin generar mutantes.
      # Existe porque `stryker.config.json` tenia un comentario dentro de
      # `thresholds`, el esquema de Stryker 10 no admite propiedades extra ahi,
      # y `stryker run` abortaba ANTES de generar un solo mutante — pero el
      # `continue-on-error` del paso siguiente se tragaba el fallo y el job salia
      # en verde. Un error de configuracion no puede volver a pasar inadvertido.
      - name: Validar la configuracion de Stryker
        run: pnpm exec stryker run --dryRunOnly
      # SIN continue-on-error: si algun modulo critico queda por debajo de su
      # `thresholds.break`, este paso falla y arrastra al job (ver la cabecera
      # de este fichero para la demostracion local de que esto es real).
      - name: Mutation testing sobre los modulos criticos
        run: pnpm test:mutation
      - name: Mensaje claro si el umbral no se alcanzo
        if: failure()
        run: |
          echo "::error::La puntuacion de mutacion de al menos un modulo critico no llega a su umbral (thresholds.break en stryker.config.json). Esto significa que los tests de ese modulo NO comprueban lo suficiente: pasan aunque el comportamiento cambie. No es un fallo de infraestructura, es una senal real (CLAUDE.md 7) — revisa el informe HTML subido como artefacto (mutation-report) para ver que mutante sobrevivio y que test deberia haberlo matado."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
          if-no-files-found: ignore
